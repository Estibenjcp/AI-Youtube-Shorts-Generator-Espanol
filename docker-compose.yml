# Stack de AutoShorts AI para Portainer.
#
# Dos contenedores, una sola imagen:
#   app     -> la interfaz de siempre, en el puerto 8501. Para trabajar a mano,
#              probar voces y dejar preparado el preset del worker.
#   worker  -> --serve: expone POST /generar en el puerto 8600 para que n8n
#              (AppFlowy -> n8n -> aqui) pida un render bajo demanda. Nunca
#              corre dos a la vez: un solo candado interno los encadena.
#              El modo --daemon (tanda diaria desde temas.txt) sigue en el
#              codigo y se puede volver a el cambiando el "command" de abajo,
#              pero con --serve activo no corre en paralelo.
#
# En Portainer:  Stacks -> Add stack -> Repository (apunta a tu repo de GitHub)
# y rellena las variables de entorno abajo en "Environment variables".

services:

  app:
    build: .
    image: autoshorts-ai:latest
    container_name: autoshorts-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      TZ: ${TZ:-America/Bogota}
      # ── IA que escribe el guion ──
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY:  ${AI_API_KEY}
      AI_MODEL:    ${AI_MODEL:-gemini-2.0-flash-exp}
      # ── Banco de video ──
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      # ── Voz ──
      FISH_API_KEY:  ${FISH_API_KEY}
      FISH_MODEL:    ${FISH_MODEL:-s2.1-pro-free}
      FISH_VOICE_ID: ${FISH_VOICE_ID}
      # ── Voz alternativa y video por IA ──
      GOOGLE_TTS_KEY:      ${GOOGLE_TTS_KEY:-}
      ELEVENLABS_API_KEY:  ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      AI_VIDEO_PROVIDER:   ${AI_VIDEO_PROVIDER:-fal}
      AI_VIDEO_KEY:        ${AI_VIDEO_KEY:-}
      AI_VIDEO_MODEL:      ${AI_VIDEO_MODEL:-}
      # ── Acceso a la interfaz ──
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - datos:/datos
      # Carpeta real del servidor donde caen los mp4 terminados, para que puedas
      # abrirlos por SMB/SFTP sin entrar al contenedor. Creala antes de arrancar:
      #   sudo mkdir -p /srv/autoshorts/salida
      - ${SALIDA_DIR:-/srv/autoshorts/salida}:/app/assets/salida
      - historial:/app/assets
    # Techo de memoria. Medido en el servidor: 7,6 Gi totales, 3,0 Gi
    # disponibles. Los dos topes juntos (0,75 + 2 = 2,75 Gi) caben en esos 3 Gi,
    # asi que un render no puede llevarse por delante lo demas que corre ahi.
    # La interfaz apenas consume: quien renderiza es el worker.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build: .
    image: autoshorts-ai:latest
    container_name: autoshorts-worker
    restart: unless-stopped
    command: ["python", "worker.py", "--serve"]
    ports:
      # Solo LAN, sin TLS: el token en WORKER_HTTP_TOKEN es la unica proteccion,
      # igual que otros paneles de este servidor (Portainer, Beszel) que ya se
      # exponen asi puertas adentro de la red. No publicar esto hacia internet.
      - "8600:8600"
    environment:
      TZ: ${TZ:-America/Bogota}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY:  ${AI_API_KEY}
      AI_MODEL:    ${AI_MODEL:-gemini-2.0-flash-exp}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      FISH_API_KEY:  ${FISH_API_KEY}
      FISH_MODEL:    ${FISH_MODEL:-s2.1-pro-free}
      FISH_VOICE_ID: ${FISH_VOICE_ID}
      # ── Voz alternativa y video por IA ──
      GOOGLE_TTS_KEY:      ${GOOGLE_TTS_KEY:-}
      ELEVENLABS_API_KEY:  ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      AI_VIDEO_PROVIDER:   ${AI_VIDEO_PROVIDER:-fal}
      AI_VIDEO_KEY:        ${AI_VIDEO_KEY:-}
      AI_VIDEO_MODEL:      ${AI_VIDEO_MODEL:-}
      # ── Programacion de la tanda diaria ──
      WORKER_HORA:          ${WORKER_HORA:-06:00}
      WORKER_VIDEOS_TANDA:  ${WORKER_VIDEOS_TANDA:-3}
      WORKER_PRESET_FILE:   /datos/preset.json
      WORKER_TEMAS_FILE:    /datos/temas.txt
      WORKER_SALIDA_DIR:    /app/assets/salida
      # ── Endpoint HTTP para n8n (modo --serve) ──
      WORKER_HTTP_TOKEN: ${WORKER_HTTP_TOKEN}
      WORKER_HTTP_PORT:  ${WORKER_HTTP_PORT:-8600}
      # ── Aviso cuando termina (opcional) ──
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:   ${TELEGRAM_CHAT_ID:-}
    volumes:
      - datos:/datos
      # Carpeta real del servidor donde caen los mp4 terminados, para que puedas
      # abrirlos por SMB/SFTP sin entrar al contenedor. Creala antes de arrancar:
      #   sudo mkdir -p /srv/autoshorts/salida
      - ${SALIDA_DIR:-/srv/autoshorts/salida}:/app/assets/salida
      - historial:/app/assets
    # El worker es quien renderiza: se lleva la parte grande de los 3 Gi libres.
    # Nunca hace dos videos a la vez, los encadena uno tras otro.
    mem_limit: 2g

volumes:
  # preset.json y temas.txt — lo que tu configuras.
  datos:
  # assets/ del pipeline, incluido used_topics.json, para que el historial de
  # temas sobreviva a los reinicios y no se repitan videos.
  historial:
